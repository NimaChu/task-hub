<body data-deliverable="application" data-kind="dashboard">
  <header class="top"><div class="top-inner"><!-- PROJECT_BRAND --><div class="header-copy"><h1>任务工作台</h1><div class="state" id="dataState" role="status" aria-live="polite"></div></div><div class="actions"><button class="button" id="export" type="button">导出修改后 JSON</button><button class="button primary" id="refresh" type="button">刷新快照</button></div></div></header>
  <main class="main"><section class="metrics" id="metrics"></section><section class="controls"><input id="search" type="search" placeholder="搜索任务、派发人、来源" aria-label="搜索任务、派发人、来源"><select id="replyFilter" aria-label="沟通状态筛选"><option value="">全部沟通状态</option><option value="replied">已回复</option><option value="meeting_accepted">已接受会议</option><option value="not_replied">未回复</option></select><select id="attachmentFilter" aria-label="附件状态筛选"><option value="">全部附件状态</option><option value="openable">有可打开附件</option><option value="located">已定位未导出</option><option value="none">无附件</option></select></section><div class="notice" id="notice">正在读取嵌入数据…</div><section class="board" id="board" hidden></section></main>
  <div class="scrim" id="scrim"></div><aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <script id="embedded-task-data" type="application/json">__MAIL_TASK_DATA_JSON__</script>
  <script>
  const columns=[['pending','待确认'],['acknowledged','待执行'],['in_progress','进行中'],['completed','已完成']];
  const priorities=[['high','高'],['medium','中'],['low','低']],priorityRank={high:0,medium:1,low:2};

  const state={data:null,source:null,overrides:{},query:'',reply:'',attachment:''},el=id=>document.getElementById(id),txt=v=>String(v??'');

  function compareTasks(a,b){const priority=(priorityRank[a.priority]??1)-(priorityRank[b.priority]??1);if(priority)return priority;const due=deadlineTime(a.deadline)-deadlineTime(b.deadline);if(!Number.isNaN(due)&&due)return due;return timestampForSort(b.received_at)-timestampForSort(a.received_at)}

  function tasks(){return state.data.tasks.filter(t=>{const q=state.query.trim().toLowerCase();const hit=!q||[t.title,t.task_content,t.assigner,t.source_subject,t.request_evidence,t.response_evidence].some(v=>txt(v).toLowerCase().includes(q));return hit&&(!state.reply||t.communication_status===state.reply)&&(!state.attachment||attachmentState(t)===state.attachment)})}
  function metric(label,value){const m=node('div','metric');m.append(node('span','',label),node('strong','',value));return m}
  function render(){const all=state.data.tasks,visible=tasks();el('metrics').replaceChildren(metric('全部任务',all.length),metric('尚未完成',all.filter(t=>t.status!=='completed').length),metric('已回复但未完成',all.filter(t=>['replied','meeting_accepted'].includes(t.communication_status)&&t.status!=='completed').length),metric('未回复',all.filter(t=>t.communication_status==='not_replied').length),metric('可打开附件',all.filter(t=>attachmentState(t)==='openable').length));const board=el('board');board.replaceChildren();for(const [status,label] of columns){const col=node('section','column'),head=node('div','column-head'),items=visible.filter(t=>t.status===status).sort(compareTasks),cards=node('div','cards');head.append(node('h2','',label),node('span','',items.length));if(!items.length)cards.append(node('p','empty','暂无任务'));for(const t of items)cards.append(card(t));setupDrop(col,status);col.append(head,cards);board.append(col)}el('notice').hidden=true;board.hidden=false}
  function quickField(t,label,key,options){const wrap=node('label','quick-field');wrap.append(node('span','',label));const input=node(options?'select':'input','');input.setAttribute('aria-label',`${t.title||t.task_content} · ${label}`);if(options)for(const [v,l] of options){const o=node('option','',l);o.value=v;input.append(o)}else input.type='date';input.value=t[key]||'';input.onchange=()=>updateTask(t.id,{[key]:input.value});input.ondragstart=e=>e.stopPropagation();wrap.append(input);return wrap}
  function card(t){const b=node('article','card');b.draggable=true;b.dataset.taskId=t.id;const e=node('div','eyebrow');e.append(node('span','badge',({email:'邮箱',manual:'手动',wecom:'企业微信',teams:'Teams'})[t.source_channel]||t.source_channel||'邮箱'),node('span','who',t.assigner||'未指定派发人'),node('span','',fmtDate(t.received_at)));const title=node('button','card-title',t.title||t.task_content||'未命名任务');title.type='button';title.onclick=()=>openTask(t);b.append(e,title);const quick=node('div','quick-controls');quick.append(quickField(t,'优先级','priority',priorities),quickField(t,'截止日期','deadline'),quickField(t,'状态','status',columns));b.append(quick,node('div','foot',deadlineLabel(t.deadline)));const badges=node('div','badges');if(t.communication_status==='replied')badges.append(node('span','badge reply','已回复'));if(t.status==='completed')badges.append(node('span','badge file','已完成'));const a=attachmentState(t);if(a==='openable')badges.append(node('span','badge file','附件可打开'));if(a==='located')badges.append(node('span','badge blocked','附件已定位'));if(t.parent_task_id){const link=node('button','related-link','修改任务 · 查看原任务');link.type='button';link.onclick=()=>showRelated(t.parent_task_id);badges.append(link)}b.append(badges);b.ondragstart=e=>{state.dragId=t.id;e.dataTransfer.setData('text/plain',t.id);e.dataTransfer.effectAllowed='move';b.classList.add('dragging')};b.ondragend=()=>{state.dragId=null;document.querySelectorAll('.drag-over,.dragging').forEach(n=>n.classList.remove('drag-over','dragging'))};return b}
  function showRelated(id){const t=state.data.tasks.find(t=>t.id===id);if(t)openTask(t);else el('dataState').textContent='关联任务尚未导入：'+id}
  function relatedTasks(t){const s=node('section','section');s.append(node('h3','','关联任务'));const related=state.data.tasks.filter(x=>x.id===t.parent_task_id||x.parent_task_id===t.id);if(!related.length)s.append(node('p','',t.parent_task_id?'原任务尚未导入：'+t.parent_task_id:'无关联任务'));for(const item of related){const b=node('button','related-link',`${item.id===t.parent_task_id?'原任务':'后续修改'}：${item.title||item.task_content}`);b.type='button';b.onclick=()=>openTask(item);s.append(b)}if(t.relationship_reason)s.append(node('p','',t.relationship_reason));return s}
  function setupDrop(col,status){col.dataset.status=status;col.ondragover=e=>{if(state.dragId){e.preventDefault();e.dataTransfer.dropEffect='move';col.classList.add('drag-over')}};col.ondragleave=e=>{if(!col.contains(e.relatedTarget))col.classList.remove('drag-over')};col.ondrop=e=>{e.preventDefault();col.classList.remove('drag-over');const id=state.dragId;if(!id||e.dataTransfer.getData('text/plain')!==id)return;state.dragId=null;updateTask(id,{status})}}
  function updateTask(id,changes){const t=state.data.tasks.find(x=>x.id===id);if(!t)return;const next={...state.overrides,[id]:{...state.overrides[id],...changes,...(Object.hasOwn(changes,'status')?{_completionEvidence:t.applied_completion_evidence||''}:{})}};try{localStorage.setItem(STORAGE_KEY,JSON.stringify(next))}catch{el('dataState').textContent='保存失败：浏览器存储不可用，请导出备份后重试';render();return}Object.assign(t,changes);t.updated_at=new Date().toISOString();state.overrides=next;el('dataState').textContent='修改已自动保存 · 可拖动卡片切换状态';render()}
  function section(title,value){const s=node('section','section');s.append(node('h3','',title),node('p','',value||'未提供'));return s}
  function evidence(t){const s=node('section','section');s.append(node('h3','','任务证据'));for(const [label,value] of [['原始要求',t.request_evidence],['本人回复',t.response_evidence],['完成证据',t.completion_evidence],['Agent 判断',t.review_reasoning]]){const a=node('div','audit');a.append(node('strong','',label),node('p','',value||'未发现'));s.append(a)}return s}
  function mails(items){const s=node('section','section');s.append(node('h3','','关联邮件'));if(!Array.isArray(items)||!items.length){s.append(node('p','','无'));return s}for(const m of items){const d=node('div','mail '+(m.role==='response'?'response':''));d.append(node('strong','',`#${m.local_id??m.message_key??''} · ${m.subject||'无主题'}`),node('small','',`${m.sender||''} · ${fmtDate(m.received_at)} · ${m.role==='response'?'本人回复':'任务来源'}`),node('p','',m.excerpt||''));s.append(d)}return s}
  function attachments(items){const s=node('section','section');s.append(node('h3','','附件'));if(!Array.isArray(items)||!items.length){s.append(node('p','','无附件'));return s}for(const item of items){const box=node('div','attachment'),left=node('div','');const name=typeof item==='string'?item:(item.name||item.filename||item.indexed_name||'未命名附件'),href=item&&typeof item==='object'?safeAttachmentHref(item.saved_path):'',isEml=name.toLowerCase().endsWith('.eml'),useFoxmail=isEml&&state.data.ui?.foxmail_protocol===true;left.append(node('strong','',name));if(item&&typeof item==='object')left.append(node('small','',href?(useFoxmail?'使用本机 Foxmail 打开；也可下载后双击':'已复制到项目，可点击打开'):`已定位于 Foxmail 容器 ${item.foxmail_container||''}，尚未导出`));box.append(left);if(href){const actions=node('div','attachment-actions'),a=node('a','',useFoxmail?'Foxmail 打开':'打开');a.href=useFoxmail?foxmailHref(href):href;if(!useFoxmail)a.target='_blank';a.rel='noopener';actions.append(a);if(isEml){const fallback=node('a','fallback','下载 EML');fallback.href=href;fallback.download=name;actions.append(fallback)}box.append(actions)}else box.append(node('span','badge blocked','不可直接打开'));s.append(box)}return s}
  function field(label,name,value,kind='input'){const w=node('label','field');w.append(node('span','',label));let c;if(kind==='textarea')c=node('textarea','');else if(kind==='status'||kind==='priority'){c=node('select','');const options=kind==='status'?columns:priorities;for(const [v,l] of options){const o=node('option','',l);o.value=v;o.selected=v===value;c.append(o)}}else{c=node('input','');c.type=name==='deadline'?'date':'text'}c.name=name;c.value=txt(value);w.append(c);return w}
  function openTask(t){const d=el('drawer');d.replaceChildren();const h=node('div','drawer-head');h.append(node('h2','',t.title||t.task_content));const x=node('button','close','×');x.type='button';x.onclick=closeTask;h.append(x);const f=node('form','form');f.append(field('一句话标题','title',t.title||''),field('任务内容','task_content',t.task_content,'textarea'),field('任务派发人','assigner',t.assigner),field('截止日期','deadline',t.deadline),field('优先级','priority',t.priority||'medium','priority'),field('当前状态','status',t.status,'status'),field('执行备注 / 完成依据','notes',t.notes,'textarea'));const acts=node('div','actions'),save=node('button','button primary','保存浏览器修改'),reset=node('button','button','恢复 JSON 原值');save.type='submit';reset.type='button';reset.onclick=()=>resetTask(t.id);acts.append(save,reset);f.append(acts,node('p','save-note','修改保存在当前浏览器；导出 JSON 后可由项目脚本正式回写。'));f.onsubmit=e=>saveTask(e,t.id);d.append(h,node('p','meta',`${t.assigner||'未知派发人'} · ${t.source_channel||'email'} · ${fmtDate(t.received_at||t.created_at)}`),section('任务内容',t.task_content),section('信息来源',t.source_subject||t.source_reference||'用户直接描述'),section('优先级依据',t.priority_reason),section('截止日期依据',t.deadline_basis||t.deadline_original),evidence(t),relatedTasks(t),attachments(t.attachments),...(t.source_channel==='email'||!t.source_channel?[mails(t.related_messages)]:[]),section('当前备注',t.notes),f);d.classList.add('open');el('scrim').classList.add('open');d.setAttribute('aria-hidden','false')}

  function saveTask(e,id){e.preventDefault();const v=new FormData(e.currentTarget);updateTask(id,Object.fromEntries(editable.map(k=>[k,txt(v.get(k))])));openTask(state.data.tasks.find(t=>t.id===id))}
  function resetTask(id){const a=state.source.tasks.find(x=>x.id===id),b=state.data.tasks.find(x=>x.id===id);for(const k of editable)b[k]=a[k]??'';delete state.overrides[id];try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state.overrides))}catch{}render();openTask(b)}
  function exportData(){const blob=new Blob([JSON.stringify({...state.data,updated_at:new Date().toISOString()},null,2)+'\n'],{type:'application/json'}),a=node('a','');a.href=URL.createObjectURL(blob);a.download='task-data.edited.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function load(){try{const d=JSON.parse(el('embedded-task-data').textContent);if(!Array.isArray(d.tasks))throw Error('缺少 tasks 数组');for(const t of d.tasks)if(t.status==='review')t.status='completed';state.source=structuredClone(d);try{state.overrides=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch{state.overrides={}}for(const t of d.tasks){const o=state.overrides[t.id];if(o){if(o.status==='review')o.status='completed';if(t.applied_completion_evidence&&o._completionEvidence!==t.applied_completion_evidence)delete o.status;for(const k of editable)if(Object.hasOwn(o,k))t[k]=o[k]}}state.data=d;el('dataState').textContent='';render()}catch(e){el('notice').className='notice error';el('notice').textContent='数据载入失败：'+e.message;el('dataState').textContent='载入失败'}}
  el('search').oninput=e=>{state.query=e.target.value;render()};el('replyFilter').onchange=e=>{state.reply=e.target.value;render()};el('attachmentFilter').onchange=e=>{state.attachment=e.target.value;render()};el('export').onclick=exportData;el('refresh').onclick=()=>location.reload();el('scrim').onclick=closeTask;document.onkeydown=e=>{if(e.key==='Escape')closeTask()};load();
  </script>
</body></html>
